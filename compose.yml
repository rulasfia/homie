# Deploy from GHCR:
#   HOMIE_IMAGE=ghcr.io/OWNER/homie:v0.1.0 docker compose up -d --no-build
#
# Build and run locally:
#   docker compose up -d --build
#
# For a private GHCR image, log in first:
#   echo $CR_PAT | docker login ghcr.io -u USERNAME --password-stdin

services:
  homie:
    image: ${HOMIE_IMAGE:-homie:local}
    build: .
    container_name: homie
    restart: unless-stopped
    ports:
      - "${HOMIE_PORT:-3000}:3000"
    # Optional: copy .env.example to .env for Beszel / Docker settings.
    env_file:
      - path: .env
        required: false
    environment:
      # Override this if you use a docker-socket-proxy sidecar instead of mounting the host socket.
      - DOCKER_SOCKET=${DOCKER_SOCKET:-/var/run/docker.sock}
    volumes:
      # Mount your own config file. The bundled homie.config.yaml is used if this file is missing.
      - ${HOMIE_CONFIG:-./homie.config.yaml}:/app/homie.config.yaml:ro
      # Mount the Docker socket to enable the Containers section. `:ro` does not limit
      # the Docker API: this gives homie root-level access to the host. For a safer
      # setup, see "Security" in the README (docker-socket-proxy + DOCKER_HOST).
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:${DOCKER_SOCKET:-/var/run/docker.sock}:ro
