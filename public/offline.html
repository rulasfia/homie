<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121315" />
    <title>homie offline</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("homie:theme");
        } catch {
          // Storage may be unavailable; follow the system theme instead.
        }
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia?.("(prefers-color-scheme: light)").matches === true
              ? "light"
              : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* Mirrors the dashboard's rack faceplate with system fonts, since the bundled
         fonts may not be cached when this page is shown. */
      :root {
        color-scheme: dark;
        --chassis: #121315;
        --vent: rgb(0 0 0 / 55%);
        --plate-top: #2d3034;
        --plate-bottom: #222428;
        --key-top: #3b3f44;
        --key-bottom: #2c2f33;
        --key-skirt: #151719;
        --ink: #e7e9eb;
        --muted: #9aa1a8;
        --accent: #ffb21e;
        --down: #ff5b4f;
        --highlight: rgb(255 255 255 / 8%);
        --drop: rgb(0 0 0 / 50%);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --chassis: #c3c7cc;
        --vent: rgb(0 0 0 / 12%);
        --plate-top: #f1f3f5;
        --plate-bottom: #dde0e4;
        --key-top: #fdfdfd;
        --key-bottom: #e2e5e8;
        --key-skirt: #9ea3a9;
        --ink: #1b1e22;
        --muted: #4d545b;
        --accent: #b86e00;
        --down: #e23b2e;
        --highlight: rgb(255 255 255 / 85%);
        --drop: rgb(40 46 54 / 28%);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        background-color: var(--chassis);
        background-image: radial-gradient(var(--vent) 1.3px, transparent 1.7px);
        background-size: 9px 9px;
        color: var(--ink);
        font-family: "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 30rem;
        padding: 1.75rem 2rem 2rem;
        border-radius: 6px;
        background: linear-gradient(180deg, var(--plate-top), var(--plate-bottom));
        box-shadow:
          inset 0 1px 0 var(--highlight),
          0 3px 6px var(--drop),
          0 14px 30px var(--drop);
      }

      h1 {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 0 0 1rem;
        font-size: clamp(1.25rem, 5vw, 1.625rem);
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      h1::before {
        content: "";
        flex-shrink: 0;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--down);
        box-shadow: 0 0 12px var(--down);
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }

      .retry {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0.5rem 1.25rem;
        border-radius: 6px;
        background: linear-gradient(180deg, var(--key-top), var(--key-bottom));
        color: var(--ink);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-decoration: none;
        box-shadow:
          inset 0 1px 0 var(--highlight),
          0 4px 0 var(--key-skirt),
          0 6px 10px var(--drop);
        transition:
          transform 80ms cubic-bezier(0.23, 1, 0.32, 1),
          box-shadow 80ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .retry:active {
        transform: translateY(4px);
        box-shadow:
          inset 0 1px 0 var(--highlight),
          0 0 0 var(--key-skirt),
          0 1px 2px var(--drop);
      }

      .retry:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .hint {
        margin: 2rem 0 0;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        homie can't reach your server. Live status and links need a connection, so they aren't shown
        here.
      </p>
      <a class="retry" href="/">Reconnect</a>
      <p class="hint">
        If this keeps happening, check that the server is running and this device can reach it.
      </p>
    </main>
  </body>
</html>
