<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>homie offline</title>
    <script>
      (() => {
        let theme;
        try {
          theme = localStorage.getItem("homie:theme");
        } catch {
          // Storage may be unavailable; follow the system theme instead.
        }
        if (theme !== "light" && theme !== "dark") {
          theme =
            window.matchMedia?.("(prefers-color-scheme: light)").matches === true
              ? "light"
              : "dark";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      :root {
        color-scheme: dark;
        --color-bg: #0d1117;
        --color-text: #e6e9ef;
        --color-text-muted: #8b94a3;
        --color-accent: #58a6ff;
        --color-accent-subtle: rgb(88 166 255 / 15%);
      }

      :root[data-theme="light"] {
        color-scheme: light;
        --color-bg: #f4f5f7;
        --color-text: #1b1f26;
        --color-text-muted: #5c6470;
        --color-accent: #0969da;
        --color-accent-subtle: rgb(9 105 218 / 10%);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--color-bg);
        color: var(--color-text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        font-size: 1rem;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        max-width: 28rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        line-height: 1.2;
        letter-spacing: -0.02em;
        text-wrap: balance;
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--color-text-muted);
      }

      .retry {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0.5rem 1rem;
        border: 1px solid var(--color-accent);
        border-radius: 6px;
        color: var(--color-accent);
        font-weight: 600;
        text-decoration: none;
        transition: background 120ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .retry:hover {
        background: var(--color-accent-subtle);
      }

      .retry:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }

      .hint {
        margin: 2rem 0 0;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        homie can't reach your server. Live status and links need a connection, so they aren't shown
        here.
      </p>
      <a class="retry" href="/">Reconnect</a>
      <p class="hint">
        If this keeps happening, check that the server is running and this device can reach it.
      </p>
    </main>
  </body>
</html>
