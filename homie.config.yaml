title: Homie
openInNewTab: true # set to false to open bookmarks in the current tab

pingTimeoutMs: 5000
cacheTtlMs: 5000 # server-side cache TTL for pings, systems, and containers; set to 0 to disable

# The `icon` field on a bookmark can be:
#   - an emoji or single letter (rendered as text)
#   - an absolute URL: icon: https://cdn.example.com/icon.svg
#   - a root-relative path: icon: /icons/icon.svg
# If an image fails to load, the tile falls back to the first letter of the bookmark name.

# Optional copyable addresses for machines. `name` must exactly match the name in Beszel.
# machines:
#   - name: homeserver
#     address: root@192.168.1.10

groups:
  - name: Monitoring
    bookmarks:
      - name: Beszel
        url: https://beszel.example.com
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons@main/webp/beszel.webp
        ping: true
      - name: Uptime Kuma
        url: https://uptime.example.com
        icon: ⏱️
        ping: true

  - name: Media
    bookmarks:
      - name: Jellyfin
        url: https://jellyfin.example.com
        description: Movies & TV
        icon: 🎬
        ping: true
      - name: Navidrome
        url: https://music.example.com
        description: Music
        icon: 🎵

  - name: Infrastructure
    bookmarks:
      - name: Router
        url: http://192.168.1.1
        icon: 📡
        ping: true
      - name: Proxmox
        url: https://proxmox.example.com:8006
        icon: 🖥️
        ping: true
