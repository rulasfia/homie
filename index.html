<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Homelab dashboard" />
    <!-- Blue-leaning graphite between the dark aqua and metal chassis, so the browser
         bar fits either theme until the loaded one sets its own color. -->
    <meta name="theme-color" content="#0c1219" />
    <script>
      // Apply the saved theme before styles load to avoid a flash of the wrong theme.
      let theme;
      try {
        theme = localStorage.getItem("homie:theme");
      } catch {
        // Storage may be unavailable; follow the system theme instead.
      }
      document.documentElement.dataset.theme =
        theme === "light" || theme === "dark"
          ? theme
          : matchMedia("(prefers-color-scheme: light)").matches
            ? "light"
            : "dark";
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>homie</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
